apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
data:
  pve.yml: |
    default:
      user: {{ .Values.pve.user | quote }}
      token_name: {{ .Values.pve.tokenName | quote }}
      token_value: {{ .Values.pve.tokenValue | quote }}
      verify_ssl: {{ .Values.pve.verifySsl }}
