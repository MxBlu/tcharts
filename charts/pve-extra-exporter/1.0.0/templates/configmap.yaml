apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
data:
  exporter.py: |
    #!/usr/bin/env python3
    """pve-extra-exporter: node network rates (RRD) + user last-login (syslog)."""
    import calendar
    import json
    import os
    import re
    import ssl
    import threading
    import time
    import urllib.request
    from datetime import datetime
    from http.server import BaseHTTPRequestHandler, HTTPServer
    
    PVE_HOST = os.environ.get("PVE_HOST", "192.168.2.10")
    PVE_PORT = int(os.environ.get("PVE_PORT", "8006"))
    PVE_USER = os.environ["PVE_USER"]
    PVE_TOKEN_NAME = os.environ["PVE_TOKEN_NAME"]
    PVE_TOKEN_VALUE = os.environ["PVE_TOKEN_VALUE"]
    VERIFY_SSL = os.environ.get("PVE_VERIFY_SSL", "false").lower() == "true"
    POLL = int(os.environ.get("POLL_INTERVAL", "60"))
    LISTEN = int(os.environ.get("PORT", "9224"))
    
    ctx = ssl.create_default_context()
    if not VERIFY_SSL:
        ctx = ssl._create_unverified_context()
    
    MONTHS = {m: i + 1 for i, m in enumerate(
        ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
         "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"])}
    AUTH_RE = re.compile(r"<([^>]+)> successful auth")
    TS_RE = re.compile(r"^(\w{3})\s+(\d+)\s+(\d+):(\d+):(\d+)")
    
    state = {"net": {}, "logins": {}, "ok": False}
    lock = threading.Lock()
    
    
    def api(path):
        url = "https://" + PVE_HOST + ":" + str(PVE_PORT) + "/api2/json" + path
        req = urllib.request.Request(
            url, headers={"Authorization": "PVEAPIToken=" + PVE_USER + "!" +
                          PVE_TOKEN_NAME + "=" + PVE_TOKEN_VALUE})
        with urllib.request.urlopen(req, timeout=25, context=ctx) as r:
            return json.load(r)["data"]
    
    
    def api_raw(path):
        url = "https://" + PVE_HOST + ":" + str(PVE_PORT) + "/api2/json" + path
        req = urllib.request.Request(
            url, headers={"Authorization": "PVEAPIToken=" + PVE_USER + "!" +
                          PVE_TOKEN_NAME + "=" + PVE_TOKEN_VALUE})
        with urllib.request.urlopen(req, timeout=25, context=ctx) as r:
            return json.load(r)
    
    
    def parse_ts(line, offset, year):
        m = TS_RE.match(line)
        if not m:
            return 0
        mon, day, hh, mm, ss = m.groups()
        tup = (year, MONTHS.get(mon, 1), int(day),
               int(hh), int(mm), int(ss), 0, 0, 0)
        return calendar.timegm(tup) - offset
    
    
    def poll_once():
        net, logins = {}, {}
        try:
            nodes = [n["node"] for n in api("/nodes")]
            year = datetime.now().year
            for node in nodes:
                t = api("/nodes/" + node + "/time")
                offset = t["localtime"] - t["time"]
                rr = api("/nodes/" + node +
                         "/rrddata?timeframe=hour&cf=AVERAGE")
                pts = [p for p in rr if p.get("netin") is not None]
                if pts:
                    last = pts[-1]
                    net[node] = (float(last.get("netin") or 0),
                                 float(last.get("netout") or 0))
                total = api_raw("/nodes/" + node + "/syslog?start=0&limit=1")["total"]
                start = max(0, total - 2000)
                entries = api("/nodes/" + node + "/syslog?start=" +
                              str(start) + "&limit=2000")
                for e in entries:
                    line = e.get("t", "")
                    m = AUTH_RE.search(line)
                    if not m:
                        continue
                    ts = parse_ts(line, offset, year)
                    if ts <= 0:
                        continue
                    user = m.group(1)
                    if ts > logins.get(user, 0):
                        logins[user] = ts
        except Exception as e:
            print("poll failed: " + str(e), flush=True)
            with lock:
                state["ok"] = False
            return
        with lock:
            state["net"] = net
            # keep previous logins, update with newer observations
            for u, ts in logins.items():
                if ts > state["logins"].get(u, 0):
                    state["logins"][u] = ts
            state["ok"] = True
            state["ts"] = time.time()
    
    
    def render():
        with lock:
            lines = []
            lines.append("# HELP pvextra_up 1 if the last Proxmox poll succeeded.")
            lines.append("# TYPE pvextra_up gauge")
            lines.append("pvextra_up " + ("1" if state["ok"] else "0"))
            lines.append("# HELP pvextra_node_network_receive_bytes_per_second Node NIC receive rate.")
            lines.append("# TYPE pvextra_node_network_receive_bytes_per_second gauge")
            for n, (rx, tx) in sorted(state["net"].items()):
                lines.append('pvextra_node_network_receive_bytes_per_second{node="' +
                             n + '"} ' + str(rx))
            lines.append("# HELP pvextra_node_network_transmit_bytes_per_second Node NIC transmit rate.")
            lines.append("# TYPE pvextra_node_network_transmit_bytes_per_second gauge")
            for n, (rx, tx) in sorted(state["net"].items()):
                lines.append('pvextra_node_network_transmit_bytes_per_second{node="' +
                             n + '"} ' + str(tx))
            lines.append("# HELP pvextra_user_last_login_timestamp_seconds Last successful auth per user.")
            lines.append("# TYPE pvextra_user_last_login_timestamp_seconds gauge")
            for u, ts in sorted(state["logins"].items()):
                lines.append('pvextra_user_last_login_timestamp_seconds{user="' +
                             u + '"} ' + str(int(ts)))
            return chr(10).join(lines) + chr(10)
    
    
    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/metrics":
                body = render().encode()
                self.send_response(200)
                self.send_header("Content-Type",
                                 "text/plain; version=0.0.4")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            else:
                body = b"pve-extra-exporter ok"
                self.send_response(200)
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
    
        def log_message(self, *a):
            pass
    
    
    def loop():
        while True:
            poll_once()
            time.sleep(POLL)
    
    
    threading.Thread(target=loop, daemon=True).start()
    HTTPServer(("0.0.0.0", LISTEN), H).serve_forever()
    
